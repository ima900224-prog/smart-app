<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Smart Mobile App Pro</title>

<link rel="stylesheet" href="style.css">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">

<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
</head>

<body>

<!-- TOP BAR -->
<div class="top">
<div id="cityName">📍 Detecting...</div>
<button onclick="toggleMap()">🗺</button>
<button onclick="useGPS()">📍</button>
</div>

<!-- MAP -->
<div id="mapBox">
<input id="cityInput" placeholder="Search city">
<button onclick="searchCity()">Search</button>
<div id="map"></div>
</div>

<!-- CLOCK -->
<div class="clock">
<div id="time">00:00:00</div>
<div id="date"></div>
</div>

<!-- WEATHER -->
<div class="weather">
<div id="icon">☀️</div>
<div id="temp">--°C</div>
<div id="desc">Loading...</div>
</div>

<!-- TIMER -->
<div class="block">
<h2>Timer</h2>
<input id="minutes" type="number" value="20">
<button onclick="startTimer()">Start</button>
<div id="timer">20:00</div>
</div>

<!-- ALARM -->
<div class="block">
<h2>Alarm</h2>
<input type="time" id="alarm">
<button onclick="setAlarm()">Set</button>
<p id="alarmStatus">Off</p>
</div>

<audio id="sound"
src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"></audio>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script src="script.js"></script>

</body>
</html>
